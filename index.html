<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Media</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #fff;
    }

    /* ===== Password Gate ===== */
    #gate {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      padding: 1.5rem;
    }
    .gate-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .gate-box h2 {
      font-size: 1.4rem;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    .gate-box p {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 1.8rem;
    }
    #password {
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    #password:focus {
      border-color: rgba(255,255,255,0.5);
    }
    #submit-btn {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    #submit-btn:hover {
      background: #2563eb;
    }
    #error {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 1rem;
      min-height: 1.2em;
      display: none;
    }

    /* ===== Protected Content ===== */
    #content {
      display: none;
      min-height: 100vh;
      background: url('background.jpg') center/cover no-repeat fixed;
      background-color: #1a1a2e;
      position: relative;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: white;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      margin-bottom: 2.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .buttons {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1.1rem 2.4rem;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 14px;
      transition: all 0.25s ease;
      min-width: 190px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    a.btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>

  <!-- Password Gate -->
  <div id="gate">
    <div class="gate-box">
      <h2>🔒 Private Access</h2>
      <p>Enter the password to continue</p>
      <form id="login-form" autocomplete="off">
        <input type="password" id="password" placeholder="Password" autofocus required>
        <button type="submit" id="submit-btn">Unlock</button>
      </form>
      <div id="error">Incorrect password</div>
    </div>
  </div>

  <!-- Protected Content (hidden until password is correct) -->
  <div id="content">
    <div class="overlay"></div>
    <div class="container">
      <h1>Your Media Library</h1>
      <div class="buttons">
        <a class="btn" href="https://1drv.ms/f/c/49f4a5e630fd940b/IgALlP0w5qX0IIBJclQAAAAAAZD7Lh7i6qpeyqh-lIb8jvM?e=BqhJ5M" target="_blank" rel="noopener noreferrer">
          🎵 Audio
        </a>
        <a class="btn" href="https://1drv.ms/f/c/49f4a5e630fd940b/IgALlP0w5qX0IIBJcVQAAAAAAYKhQM5U_9RB2x24LpI_aII?e=tn7bb4" target="_blank" rel="noopener noreferrer">
          🎬 Videos
        </a>
      </div>
    </div>
  </div>

  <script>
    // SHA-256 hash of the password "lagtsgny"
    const PASSWORD_HASH = "25195bd00125ad40dd333f3f39aacb4c40d3935acd9115f3c6e448527becbf03";

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // Remember successful unlock for this browser session
    if (sessionStorage.getItem("unlocked") === "true") {
      showContent();
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("password").value;
      const hash = await sha256(input);
      const errorEl = document.getElementById("error");

      if (hash === PASSWORD_HASH) {
        sessionStorage.setItem("unlocked", "true");
        showContent();
      } else {
        errorEl.style.display = "block";
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
      }
    });

    function showContent() {
      document.getElementById("gate").style.display = "none";
      document.getElementById("content").style.display = "block";
    }
  </script>
</body>
</html>
